<!DOCTYPE html>
<html{{ HTML_ATTRS }}>
  <head{{ HEAD_ATTRS }}>
    <script>
      (function () {
        try {
          var match = document.cookie.match(/(?:^|; )netman-theme=([^;]*)/)
          var fromCookie = match ? decodeURIComponent(match[1]) : null
          var fromStorage = localStorage.getItem('netman-theme')
          var t = fromCookie || fromStorage
          if (t === 'carbon' || t === 'carbon_dark') {
            document.documentElement.setAttribute('data-theme', t)
          }
        } catch (e) {}
      })()
    </script>
    {{ HEAD }}
  </head>
  <body{{ BODY_ATTRS }}>
    {{ APP }}
  </body>
</html>
