# NetMan - Docker Compose Production Configuration
# ==============================================================================
# Usage: docker compose --env-file .env.docker up -d --build
# ==============================================================================

services:
  # ============================================================================
  # NetMan Application
  # ============================================================================
  netman-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SSO_ISSUER=${SSO_ISSUER:-https://sso.baliroyalhospital.co.id}
        - SSO_CLIENT_ID=${SSO_CLIENT_ID}
        - SSO_CLIENT_SECRET=${SSO_CLIENT_SECRET}
        - SSO_REDIRECT_URI=${SSO_REDIRECT_URI:-https://netman.baliroyalhospital.co.id/api/auth/sso/callback}
        - APP_URL=${APP_URL:-https://netman.baliroyalhospital.co.id}
    container_name: netman-app
    restart: unless-stopped
    # Host networking — the app needs to reach devices (MikroTik, etc.) on the
    # LAN, which the isolated `postgres_default` bridge network has no route
    # to. This makes the container use the host's network stack directly, so
    # `ports:`/`networks:` don't apply anymore — the app binds straight to
    # ${PORT} on the host, and DB_HOST must point at something reachable from
    # the host itself (e.g. localhost, since Postgres publishes its port there).
    network_mode: host
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - HOST=0.0.0.0
      - PORT=${PORT:-3002}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@${DB_HOST:-localhost}:${DB_PORT:-5432}/${DB_NAME:-netMan}?schema=public
    env_file:
      - .env.docker
    healthcheck:
      test: ["CMD", "node", "docker-healthcheck.mjs"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 90s
